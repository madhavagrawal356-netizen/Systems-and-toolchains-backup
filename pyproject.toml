[project]
name = "smartops"
version = "0.1.0"
description = "Forecast hospital bed occupancy with uncertainty and staff for it."
readme = "README.md"
authors = [{ name = "Vidhi Kothari" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.0.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[project.scripts]
smartops = "smartops.cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
